# Used when a commit is pushed to the repository
# This makes use of caching for faster builds and uploads the resulting artifacts
name: Altium Fabric prototype build

on:
  push:
    branches-ignore:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Extract current branch name
        shell: bash
        # bash pattern expansion to grab branch name without slashes
        run: ref="${GITHUB_REF#refs/heads/}" && echo "branch=${ref////-}" >> $GITHUB_OUTPUT
        id: ref

      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Execute Gradle build
        run: ./gradlew :fabric:jar

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: altium-fabric-${{ steps.ref.outputs.branch }}
          path: build/mods/altium-fabric*.jar
